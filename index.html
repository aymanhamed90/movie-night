<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f16" />
<title>Movie Night</title>
<style>
html,body{height:100%;margin:0;padding:0;background:#0d0f16;}
#root{min-height:100%;}
code{font-family:'Space Mono',monospace;color:#f0b23e;background:rgba(240,178,62,0.1);padding:1px 6px;border-radius:5px;font-size:0.9em;}

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
.mn-root{--ink:#0d0f16;--ink-2:#141826;--card:#191d2b;--card-edge:#2a3042;--amber:#f0b23e;--amber-soft:#f7cf7e;--velvet:#c14a3f;--cream:#efe8da;--muted:#8b90a3;--muted-2:#5c6172;
  min-height:100%;background:radial-gradient(1200px 600px at 50% -10%, rgba(240,178,62,0.10), transparent 60%),var(--ink);color:var(--cream);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.mn-root *{box-sizing:border-box;}
.mn-top{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;max-width:860px;margin:0 auto;flex-wrap:wrap;gap:10px;}
.mn-nav{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;}
.mn-tkt{display:inline-flex;align-items:stretch;cursor:pointer;border:none;padding:0;border-radius:9px;overflow:hidden;font-family:'Space Mono',monospace;position:relative;box-shadow:0 4px 14px -6px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.28);transition:transform .15s,box-shadow .15s,filter .15s;}
.mn-tkt:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 9px 18px -6px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.34);}
.mn-tkt:active{transform:translateY(0);}
.mn-tkt-ico{display:flex;align-items:center;padding:8px 8px;font-size:12px;}
.mn-tkt-perf{align-self:stretch;width:0;border-left:1.5px dashed rgba(20,15,5,0.4);margin:6px 0;}
.mn-tkt-txt{display:flex;align-items:center;padding:8px 9px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
.mn-tkt-count{display:flex;align-items:center;padding:8px 11px;font-size:12.5px;font-weight:700;}
.mn-tkt-gold{background:linear-gradient(135deg,#f3ba4d,#f7d488);}
.mn-tkt-gold .mn-tkt-ico,.mn-tkt-gold .mn-tkt-txt{color:#3a2a06;}
.mn-tkt-gold .mn-tkt-count{background:rgba(36,26,6,0.16);color:#3a2a06;}
.mn-tkt-gold .mn-tkt-perf{border-color:rgba(58,42,6,0.35);}
.mn-tkt-red{background:linear-gradient(135deg,#c94f43,#dd7168);}
.mn-tkt-red .mn-tkt-ico,.mn-tkt-red .mn-tkt-txt{color:#2a0f0c;}
.mn-tkt-red .mn-tkt-count{background:rgba(0,0,0,0.2);color:#fff2ef;}
.mn-tkt-red .mn-tkt-perf{border-color:rgba(42,15,12,0.35);}
.mn-brand{display:flex;align-items:center;gap:10px;}
.mn-bulb{width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(240,178,62,0.18),0 0 16px 2px rgba(240,178,62,0.6);animation:mn-flicker 4s infinite;}
@keyframes mn-flicker{0%,92%,100%{opacity:1}94%{opacity:0.5}96%{opacity:1}}
.mn-brandname{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:20px;}
.mn-ghost{background:transparent;border:1px solid var(--card-edge);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Space Mono',monospace;transition:all .18s;}
.mn-ghost:hover{color:var(--cream);border-color:var(--amber);}
.mn-stage{max-width:860px;margin:0 auto;padding:24px 22px 64px;}
.mn-home{padding-top:40px;}
.mn-eyebrow{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:3px;font-size:11px;color:var(--amber);margin:0 0 18px;}
.mn-marquee{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(46px,10vw,86px);line-height:0.92;letter-spacing:1px;margin:0 0 20px;text-shadow:0 0 40px rgba(240,178,62,0.12);}
.mn-sub{font-size:16px;line-height:1.6;color:var(--muted);max-width:460px;margin:0 0 34px;}
.mn-cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px;}
.mn-primary{background:var(--amber);color:#241a06;border:none;font-weight:700;padding:15px 28px;border-radius:12px;font-size:15px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px -8px rgba(240,178,62,0.6);}
.mn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 30px -8px rgba(240,178,62,0.7);}
.mn-primary:disabled{opacity:0.5;cursor:default;}
.mn-secondary{background:transparent;color:var(--cream);border:1px solid var(--card-edge);padding:15px 24px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;transition:all .18s;}
.mn-secondary:hover{border-color:var(--amber);color:var(--amber);}
.mn-taste-strip{border-top:1px solid var(--ink-2);padding-top:22px;}
.mn-strip-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:14px;}
.mn-poster-row{display:flex;gap:10px;flex-wrap:wrap;}
.mn-mini{width:52px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;flex:0 0 auto;}
.mn-mini-more{display:flex;align-items:center;justify-content:center;background:var(--ink-2);border:1px solid var(--card-edge);color:var(--amber);font-family:'Space Mono',monospace;font-size:13px;}
.mn-poster{display:block;width:100%;height:100%;object-fit:cover;}
.mn-poster-fb{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px;position:relative;}
.mn-poster-fb .mn-fb-perf{position:absolute;top:0;bottom:0;left:6px;width:5px;background:repeating-linear-gradient(rgba(255,255,255,0.22) 0 5px,transparent 5px 11px);opacity:.5;}
.mn-fb-title{font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;font-size:15px;line-height:1.02;}
.mn-fb-year{font-family:'Space Mono',monospace;font-size:10px;color:rgba(239,232,218,0.55);margin-top:5px;}
.mn-quiz{padding-top:34px;animation:mn-fade .35s ease;}
@keyframes mn-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mn-dots{display:flex;gap:7px;margin-bottom:34px;}
.mn-dot{width:26px;height:4px;border-radius:2px;background:var(--ink-2);transition:background .3s;}
.mn-dot.on{background:var(--amber);}
.mn-qhint{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--velvet);margin:0 0 10px;}
.mn-question{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:0.5px;font-size:clamp(32px,6vw,52px);line-height:1;margin:0 0 30px;}
.mn-options{display:flex;flex-direction:column;gap:11px;}
.mn-option{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--card-edge);color:var(--cream);padding:18px 20px;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;text-align:left;transition:all .16s;}
.mn-option:hover{border-color:var(--amber);background:var(--ink-2);transform:translateX(4px);}
.mn-arrow{color:var(--amber);opacity:0;transition:opacity .16s;font-size:18px;}
.mn-option:hover .mn-arrow{opacity:1;}
.mn-back{background:none;border:none;color:var(--muted-2);cursor:pointer;margin-top:24px;font-family:'Space Mono',monospace;font-size:13px;padding:4px 0;}
.mn-back:hover{color:var(--cream);}
.mn-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:90px;text-align:center;}
.mn-beam{position:relative;width:120px;height:120px;margin-bottom:30px;}
.mn-reel{position:absolute;inset:0;border-radius:50%;border:5px solid var(--ink-2);border-top-color:var(--amber);border-right-color:var(--amber-soft);animation:mn-spin 0.9s linear infinite;box-shadow:0 0 40px rgba(240,178,62,0.25);}
.mn-beam::after{content:"";position:absolute;inset:38px;border-radius:50%;background:radial-gradient(circle,var(--amber),transparent 70%);opacity:0.4;}
@keyframes mn-spin{to{transform:rotate(360deg)}}
.mn-loadtext{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:24px;color:var(--muted);}
.mn-results{padding-top:28px;}
.mn-results-head{margin-bottom:26px;}
.mn-nowshowing{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:1px;font-size:clamp(38px,7vw,60px);line-height:1;margin:0;}
.mn-tickets{display:flex;flex-direction:column;gap:16px;}
.mn-ticket{display:flex;background:var(--card);border:1px solid var(--card-edge);border-radius:16px;overflow:hidden;transition:border-color .2s;}
.mn-ticket:hover{border-color:rgba(240,178,62,0.4);}
.mn-stub{flex:0 0 104px;position:relative;}
.mn-imdb{position:absolute;top:8px;left:8px;z-index:2;background:#f5c518;color:#1a1400;font-family:'Space Mono',monospace;font-weight:700;font-size:10.5px;letter-spacing:0.2px;padding:3px 7px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.55);white-space:nowrap;}
.mn-top250{position:absolute;top:33px;left:8px;z-index:2;background:rgba(13,15,22,0.92);color:var(--amber);border:1px solid rgba(240,178,62,0.55);font-family:'Space Mono',monospace;font-weight:700;font-size:8.5px;letter-spacing:0.4px;padding:2px 5px;border-radius:5px;white-space:nowrap;}
.mn-stub .mn-poster{aspect-ratio:2/3;}
.mn-vtear{flex:0 0 0;width:0;border-left:2px dashed var(--card-edge);position:relative;margin:14px 0;}
.mn-vtear::before,.mn-vtear::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--ink);}
.mn-vtear::before{top:-24px;}
.mn-vtear::after{bottom:-24px;}
.mn-ticket-body{flex:1;padding:18px 20px;min-width:0;}
.mn-title{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:0.5px;font-size:28px;line-height:1;margin:0 0 9px;color:var(--amber);}
.mn-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:12px;}
.mn-dot-sep{width:3px;height:3px;border-radius:50%;background:var(--muted-2);}
.mn-logline{font-size:15px;line-height:1.55;color:var(--cream);margin:0 0 12px;}
.mn-why{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0 0 16px;}
.mn-why-tag{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--velvet);background:rgba(193,74,63,0.12);padding:2px 7px;border-radius:5px;margin-right:8px;}
.mn-ticket-actions{display:flex;gap:10px;flex-wrap:wrap;}
.mn-watched{background:transparent;border:1px solid var(--card-edge);color:var(--muted);padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .16s;}
.mn-watched:hover{border-color:var(--amber);color:var(--amber);}
.mn-empty-results{margin-bottom:8px;}
.mn-love{background:transparent;border:1px solid var(--card-edge);color:var(--cream);padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .16s;}
.mn-love:hover:not(:disabled){border-color:var(--velvet);color:var(--velvet);}
.mn-love.done{border-color:var(--velvet);color:var(--velvet);background:rgba(193,74,63,0.1);cursor:default;}
.mn-skip{background:transparent;border:none;color:var(--muted-2);font-size:13px;cursor:pointer;padding:9px 6px;}
.mn-skip:hover{color:var(--muted);}
.mn-results-foot{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;align-items:center;}
.mn-restart{margin-left:auto;}
.mn-error{text-align:center;padding:40px 0;}
.mn-error p{color:var(--muted);margin-bottom:20px;}
.mn-taste{padding-top:28px;}
.mn-taste-sub{margin-bottom:22px;max-width:520px;}
.mn-add-wrap{position:relative;margin-bottom:26px;}
.mn-add-row{display:flex;gap:10px;}
.mn-input{flex:1;background:var(--ink-2);border:1px solid var(--card-edge);border-radius:11px;color:var(--cream);padding:14px 16px;font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:border-color .16s;}
.mn-input:focus{border-color:var(--amber);}
.mn-input::placeholder{color:var(--muted-2);}
.mn-add-btn{padding:14px 22px;}
.mn-drop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--card-edge);border-radius:12px;overflow:hidden;z-index:20;box-shadow:0 20px 40px -12px rgba(0,0,0,0.6);}
.mn-drop-status{padding:14px 16px;font-size:13px;color:var(--muted-2);font-family:'Space Mono',monospace;}
.mn-drop-item{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;background:transparent;border:none;border-bottom:1px solid var(--ink-2);color:var(--cream);padding:13px 16px;font-size:15px;text-align:left;cursor:pointer;transition:background .13s;}
.mn-drop-item:last-child{border-bottom:none;}
.mn-drop-item:hover{background:var(--ink-2);}
.mn-drop-title{font-weight:500;}
.mn-drop-flag{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted-2);}
.mn-drop-year{font-family:'Space Mono',monospace;font-size:12px;color:var(--amber);flex:0 0 auto;}
.mn-poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px;}
.mn-tile{position:relative;}
.mn-tile .mn-poster{aspect-ratio:2/3;border-radius:10px;overflow:hidden;border:1px solid var(--card-edge);}
.mn-tile-x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(13,15,22,0.82);color:var(--cream);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.mn-tile-x:hover{background:var(--velvet);}
.mn-tile-cap{margin-top:8px;display:flex;flex-direction:column;gap:2px;}
.mn-tile-title{font-size:13px;line-height:1.25;color:var(--cream);}
.mn-tile-year{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted-2);}
.mn-empty{border:1px dashed var(--card-edge);border-radius:12px;padding:26px;text-align:center;}
.mn-empty p{color:var(--muted);margin:0;font-size:14px;}
.mn-taste-done{margin-top:30px;}
.mn-firstrun{border:1px solid rgba(240,178,62,0.35);background:rgba(240,178,62,0.06);border-radius:14px;padding:16px 18px;margin-bottom:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:470px;}
.mn-firstrun p{margin:0;font-size:14.5px;line-height:1.55;color:var(--cream);}
.mn-firstrun strong{color:var(--amber);}
.mn-tile-btn{background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left;width:100%;font-family:inherit;display:block;}
.mn-tile-btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:12px;}
.mn-tile-poster{position:relative;}
.mn-seen-badge{position:absolute;top:6px;left:6px;z-index:2;background:rgba(13,15,22,0.85);color:var(--amber);border:1px solid rgba(240,178,62,0.5);font-family:'Space Mono',monospace;font-weight:700;font-size:9px;padding:2px 6px;border-radius:5px;}
.mn-putback-ic{position:absolute;top:6px;right:6px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(13,15,22,0.85);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid var(--card-edge);transition:all .15s;}
.mn-tile-btn:hover .mn-putback-ic{background:var(--amber);color:#241a06;}
@media (max-width:520px){.mn-cta-row{flex-direction:column;}.mn-primary,.mn-secondary{width:100%;}.mn-results-foot .mn-secondary{flex:1;}.mn-stub{flex:0 0 84px;}.mn-poster-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));}}
@media (prefers-reduced-motion:reduce){.mn-quiz,.mn-bulb,.mn-reel{animation:none;}.mn-option:hover{transform:none;}.mn-primary:hover:not(:disabled){transform:none;}}

</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ════════════════════════════════════════════════════════════════
//  PASTE YOUR FREE TMDB API KEY BETWEEN THE QUOTES BELOW.
//  Get one at:  https://www.themoviedb.org/settings/api  (free, no card)
// ════════════════════════════════════════════════════════════════
const TMDB_KEY = 01a789e459c593299f4b284154a981e5;
// ════════════════════════════════════════════════════════════════

const IMGBASE = "https://image.tmdb.org/t/p/";
const keyReady = TMDB_KEY && !TMDB_KEY.startsWith("PASTE");

const QUESTIONS = [
  { id: "feel", prompt: "What do you want to feel tonight?", hint: "The mood you're chasing",
    options: ["Cozy & comforting", "Tense & thrilling", "Deep & moving", "Light & funny", "Epic & sweeping"] },
  { id: "brain", prompt: "How much brain power have you got?", hint: "How hard you want to work for it",
    options: ["All-in focus", "Engaged but easy", "Low-effort background"] },
  { id: "novelty", prompt: "Familiar or fresh?", hint: "Comfort or discovery",
    options: ["Comfort-zone vibe", "Something new to me", "Surprise me"] },
  { id: "time", prompt: "How much time is on the clock?", hint: "Runtime matters",
    options: ["Under 100 min", "Around 2 hours", "All night — epics welcome"] },
  { id: "company", prompt: "Who's on the couch?", hint: "Tune the vibe",
    options: ["Just me", "With a partner", "Friends or family"] },
];

const GENRE = { Action:28, Adventure:12, Animation:16, Comedy:35, Crime:80, Documentary:99, Drama:18,
  Family:10751, Fantasy:14, History:36, Horror:27, Music:10402, Mystery:9648, Romance:10749,
  SciFi:878, Thriller:53, War:10752, Western:37 };
const GNAME = { 28:"Action",12:"Adventure",16:"Animation",35:"Comedy",80:"Crime",99:"Documentary",18:"Drama",
  10751:"Family",14:"Fantasy",36:"History",27:"Horror",10402:"Music",9648:"Mystery",10749:"Romance",
  878:"Sci-Fi",53:"Thriller",10752:"War",37:"Western",10770:"TV Movie" };

const FEEL_GENRES = {
  "Cozy & comforting": [GENRE.Family, GENRE.Comedy, GENRE.Romance, GENRE.Animation],
  "Tense & thrilling": [GENRE.Thriller, GENRE.Action, GENRE.Crime, GENRE.Mystery],
  "Deep & moving": [GENRE.Drama],
  "Light & funny": [GENRE.Comedy],
  "Epic & sweeping": [GENRE.Adventure, GENRE.Action, GENRE.Fantasy, GENRE.SciFi, GENRE.War],
};

const GP = {
  thriller:["#241417","#c14a3f"], crime:["#151726","#8a7cff"], drama:["#1a2030","#5b8def"],
  romance:["#241420","#e0729a"], comedy:["#241f10","#f0b23e"], "sci-fi":["#0f2028","#3fd0d6"],
  fantasy:["#1f1630","#b57ef0"], horror:["#160e12","#c14a3f"], animation:["#122032","#ffcf5c"],
  adventure:["#12241c","#4fbf78"], war:["#1c1d16","#b7a44a"], western:["#241a12","#d98a3e"],
  action:["#201313","#e8663e"], mystery:["#141826","#7aa0d0"], music:["#241426","#e07ad0"],
  history:["#1c1b18","#c9b48a"], family:["#122430","#ffd36b"], documentary:["#181c22","#9aa4b2"],
  misc:["#161a26","#f0b23e"],
};

const LS_KEY = "movienight_web_v1";
function loadLS() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (_) { return {}; } }
function saveLS(data) { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (_) {} }

async function tmdb(pathAndQuery) {
  const sep = pathAndQuery.includes("?") ? "&" : "?";
  const url = "https://api.themoviedb.org/3" + pathAndQuery + sep + "api_key=" + TMDB_KEY;
  const r = await fetch(url);
  if (!r.ok) throw new Error("tmdb " + r.status);
  return r.json();
}
function img(path, size) { return path ? IMGBASE + (size || "w342") + path : null; }
function yearOf(m) { return (m.release_date || "").slice(0, 4); }

function toItem(m) {
  return {
    id: m.id,
    title: m.title || m.name || "Untitled",
    year: yearOf(m),
    poster: img(m.poster_path, "w342"),
    rating: (typeof m.vote_average === "number" && m.vote_average > 0) ? m.vote_average.toFixed(1) : null,
    genres: (m.genre_ids || []).map((g) => GNAME[g]).filter(Boolean),
    logline: m.overview || "",
  };
}

function buildDiscover(ans, page) {
  const feel = FEEL_GENRES[ans.feel] || [GENRE.Drama];
  const params = ["with_genres=" + feel.join("|"), "include_adult=false"];
  if (ans.time.startsWith("Under")) params.push("with_runtime.lte=105");
  else if (ans.time.startsWith("Around")) { params.push("with_runtime.gte=90"); params.push("with_runtime.lte=150"); }
  else params.push("with_runtime.gte=130");
  let sort = "popularity.desc", minVotes = 400;
  if (ans.novelty.startsWith("Comfort")) { sort = "popularity.desc"; minVotes = 900; }
  else if (ans.novelty.startsWith("Surprise")) { sort = "vote_average.desc"; minVotes = 500; }
  if (ans.brain.startsWith("All-in")) { sort = "vote_average.desc"; minVotes = 800; }
  if (ans.brain.startsWith("Low-effort")) { sort = "popularity.desc"; }
  params.push("sort_by=" + sort);
  params.push("vote_count.gte=" + minVotes);
  params.push("page=" + page);
  return "/discover/movie?" + params.join("&");
}

async function recommend(ans, favorites, watched) {
  const excluded = new Set([...favorites, ...watched].map((f) => f.id));
  const first = await tmdb(buildDiscover(ans, 1));
  const totalPages = Math.min(first.total_pages || 1, 12);
  const page = 1 + Math.floor(Math.random() * Math.max(1, Math.min(totalPages, 8)));
  let pool = (page === 1 ? first : await tmdb(buildDiscover(ans, page))).results || [];
  if (favorites.length) {
    const fav = favorites[Math.floor(Math.random() * favorites.length)];
    try { const rec = await tmdb("/movie/" + fav.id + "/recommendations?page=1"); pool = pool.concat(rec.results || []); } catch (_) {}
  }
  const seen = new Set(), out = [];
  for (const m of pool) {
    if (!m || excluded.has(m.id) || seen.has(m.id) || !m.title) continue;
    seen.add(m.id); out.push(m);
  }
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out.slice(0, 5);
}

async function searchTMDB(q) {
  if (q.trim().length < 2) return [];
  const j = await tmdb("/search/movie?query=" + encodeURIComponent(q) + "&include_adult=false&page=1");
  return (j.results || []).filter((m) => m.title).slice(0, 6);
}

function whyLine(it, tasteGenres, feel) {
  const head = { "Cozy & comforting":"A warm, comforting watch", "Tense & thrilling":"A tense, gripping ride",
    "Deep & moving":"An emotional, resonant film", "Light & funny":"A genuinely funny pick",
    "Epic & sweeping":"A sweeping, big-canvas film" }[feel] || "A solid pick";
  const shared = it.genres.find((g) => tasteGenres.has(g));
  const tail = shared ? "right in your " + shared.toLowerCase() + " wheelhouse" : "worth settling in for";
  return head + " — " + tail + ".";
}

function Poster({ title, year, poster, genre, kind }) {
  const [err, setErr] = useState(false);
  const cls = "mn-poster mn-poster-" + kind;
  if (poster && !err) return <img src={poster} alt={title + " poster"} className={cls} loading="lazy" onError={() => setErr(true)} />;
  const pal = GP[(genre || "").toLowerCase()] || GP.misc;
  return (
    <div className={cls + " mn-poster-fb"} style={{ background: "linear-gradient(155deg, " + pal[0] + ", " + pal[1] + "22)" }}>
      <span className="mn-fb-perf" aria-hidden="true" />
      <span className="mn-fb-title" style={{ color: pal[1] }}>{title}</span>
      {year ? <span className="mn-fb-year">{year}</span> : null}
    </div>
  );
}

function MovieNight() {
  const [screen, setScreen] = useState("home");
  const [favorites, setFavorites] = useState([]);
  const [watched, setWatched] = useState([]);
  const [ready, setReady] = useState(false);
  const [answers, setAnswers] = useState({});
  const [step, setStep] = useState(0);
  const [picks, setPicks] = useState([]);
  const [loved, setLoved] = useState([]);
  const [error, setError] = useState(null);
  const [query, setQuery] = useState("");
  const [matches, setMatches] = useState([]);
  const [searching, setSearching] = useState(false);
  const [focused, setFocused] = useState(false);
  const queryId = useRef(0);
  const persistTimer = useRef(null);

  useEffect(() => {
    const d = loadLS();
    if (Array.isArray(d.favorites)) setFavorites(d.favorites);
    if (Array.isArray(d.watched)) setWatched(d.watched);
    setReady(true);
  }, []);

  useEffect(() => {
    if (!ready) return;
    clearTimeout(persistTimer.current);
    persistTimer.current = setTimeout(() => saveLS({ favorites, watched }), 400);
    return () => clearTimeout(persistTimer.current);
  }, [favorites, watched, ready]);

  useEffect(() => {
    const q = query.trim();
    if (q.length < 2) { setMatches([]); setSearching(false); return; }
    setSearching(true);
    const id = ++queryId.current;
    const t = setTimeout(async () => {
      let res = [];
      try { res = await searchTMDB(q); } catch (_) {}
      if (id !== queryId.current) return;
      setMatches(res); setSearching(false);
    }, 300);
    return () => clearTimeout(t);
  }, [query]);

  const tasteGenres = new Set(favorites.flatMap((f) => f.genres || []));

  function addFavorite(m) {
    const it = m.id ? toItem(m) : null;
    if (!it) return;
    if (favorites.some((f) => f.id === it.id)) { setQuery(""); setMatches([]); return; }
    setFavorites([...favorites, it]); setQuery(""); setMatches([]);
  }
  function removeFavorite(id) { setFavorites(favorites.filter((f) => f.id !== id)); }

  function startQuiz() { setAnswers({}); setStep(0); setError(null); setScreen("quiz"); }
  function choose(option) {
    const q = QUESTIONS[step];
    const next = { ...answers, [q.id]: option };
    setAnswers(next);
    if (step + 1 < QUESTIONS.length) setStep(step + 1); else generate(next);
  }

  async function generate(finalAnswers) {
    setScreen("loading"); setError(null); setLoved([]);
    try {
      const recs = await recommend(finalAnswers, favorites, watched);
      if (!recs.length) throw new Error("empty");
      const tg = new Set(favorites.flatMap((f) => f.genres || []));
      const items = recs.map((m) => {
        const it = toItem(m);
        it.gp = it.genres[0] || "misc";
        it.genreLabel = it.genres.slice(0, 2).join(" · ");
        it.why = whyLine(it, tg, finalAnswers.feel);
        return it;
      });
      setPicks(items); setScreen("results");
    } catch (e) {
      setError(String(e).includes("401")
        ? "TMDB rejected the key. Double-check your API key at the top of the file."
        : "Couldn't reach the movie database. Check your connection and try again.");
      setScreen("results");
    }
  }

  function loveIt(p) {
    setFavorites((prev) => prev.some((f) => f.id === p.id) ? prev
      : [...prev, { id: p.id, title: p.title, year: p.year, poster: p.poster, rating: p.rating, genres: p.genres }]);
    setLoved((l) => (l.includes(p.id) ? l : [...l, p.id]));
  }
  function notForMe(i) { setPicks((p) => p.filter((_, idx) => idx !== i)); }
  function markWatched(p) {
    setWatched((w) => (w.some((x) => x.id === p.id) ? w : [...w, { id: p.id, title: p.title, year: p.year, poster: p.poster, rating: p.rating, genres: p.genres }]));
    setPicks((prev) => prev.filter((x) => x.id !== p.id));
  }
  function unwatch(id) { setWatched((w) => w.filter((x) => x.id !== id)); }

  const showDrop = focused && query.trim().length >= 2 && (searching || matches.length > 0);

  if (!keyReady) {
    return (
      <div className="mn-root">
        <header className="mn-top"><div className="mn-brand"><span className="mn-bulb" /><span className="mn-brandname">Movie Night</span></div></header>
        <main className="mn-stage mn-home">
          <p className="mn-eyebrow">One-time setup</p>
          <h1 className="mn-marquee">Add your free<br />movie key</h1>
          <p className="mn-sub">This app needs a free TMDB API key to load posters and movies. Open this file in a text editor, find the line near the top that says <code>const TMDB_KEY</code>, and paste your key between the quotes.</p>
          <div className="mn-firstrun"><p><strong>Get a key (free, no card):</strong> create an account at themoviedb.org, then go to Settings → API and request a key. Paste it in, save, and reload this page.</p></div>
        </main>
      </div>
    );
  }

  return (
    <div className="mn-root">
      <header className="mn-top">
        <div className="mn-brand"><span className="mn-bulb" aria-hidden="true" /><span className="mn-brandname">Movie Night</span></div>
        {screen !== "quiz" && screen !== "loading" && (
          (screen === "taste" || screen === "watched")
            ? <button className="mn-ghost" onClick={() => setScreen("home")}>Back</button>
            : <div className="mn-nav">
                <button className="mn-tkt mn-tkt-gold" onClick={() => setScreen("taste")} aria-label={"My taste, " + favorites.length + " films"}>
                  <span className="mn-tkt-ico">♥</span><span className="mn-tkt-perf" aria-hidden="true" /><span className="mn-tkt-txt">My Taste</span><span className="mn-tkt-count">{favorites.length}</span>
                </button>
                <button className="mn-tkt mn-tkt-red" onClick={() => setScreen("watched")} aria-label={"Watched, " + watched.length + " films"}>
                  <span className="mn-tkt-ico">✓</span><span className="mn-tkt-perf" aria-hidden="true" /><span className="mn-tkt-txt">Watched</span><span className="mn-tkt-count">{watched.length}</span>
                </button>
              </div>
        )}
      </header>

      {screen === "home" && (
        <main className="mn-stage mn-home">
          <p className="mn-eyebrow">Now showing, just for you</p>
          <h1 className="mn-marquee">What are we<br />watching tonight?</h1>
          <p className="mn-sub">Answer five quick questions and I'll pull five films from the whole movie database — tuned to your mood{favorites.length > 0 ? " and your taste." : "."}</p>
          {favorites.length === 0 && (
            <div className="mn-firstrun">
              <p><strong>New here?</strong> Add a couple of films you love first — the picks get much sharper once I know your taste. You can always skip and just go by mood.</p>
              <button className="mn-secondary" onClick={() => setScreen("taste")}>Add films I love</button>
            </div>
          )}
          <div className="mn-cta-row">
            <button className="mn-primary" onClick={startQuiz} disabled={!ready}>Find me something</button>
            <button className="mn-secondary" onClick={() => setScreen("taste")}>{favorites.length ? "Edit my taste" : "Add films I love"}</button>
          </div>
          {favorites.length > 0 && (
            <div className="mn-taste-strip">
              <span className="mn-strip-label">Reads your taste from</span>
              <div className="mn-poster-row">
                {favorites.slice(0, 10).map((f) => (
                  <div className="mn-mini" key={f.id} title={f.title}><Poster title={f.title} year={f.year} poster={f.poster} genre={f.genres && f.genres[0]} kind="mini" /></div>
                ))}
                {favorites.length > 10 && <div className="mn-mini mn-mini-more">+{favorites.length - 10}</div>}
              </div>
            </div>
          )}
        </main>
      )}

      {screen === "quiz" && (
        <main className="mn-stage mn-quiz" key={step}>
          <div className="mn-dots">{QUESTIONS.map((_, i) => <span key={i} className={"mn-dot" + (i <= step ? " on" : "")} />)}</div>
          <p className="mn-qhint">{QUESTIONS[step].hint}</p>
          <h2 className="mn-question">{QUESTIONS[step].prompt}</h2>
          <div className="mn-options">
            {QUESTIONS[step].options.map((opt) => (
              <button key={opt} className="mn-option" onClick={() => choose(opt)}><span>{opt}</span><span className="mn-arrow" aria-hidden="true">→</span></button>
            ))}
          </div>
          {step > 0 && <button className="mn-back" onClick={() => setStep(step - 1)}>← back</button>}
        </main>
      )}

      {screen === "loading" && (
        <main className="mn-stage mn-loading"><div className="mn-beam" aria-hidden="true"><span className="mn-reel" /></div><p className="mn-loadtext">Developing your picks…</p></main>
      )}

      {screen === "results" && (
        <main className="mn-stage mn-results">
          <div className="mn-results-head"><p className="mn-eyebrow">Tonight's programme</p><h2 className="mn-nowshowing">Now Showing</h2></div>
          {error && <div className="mn-error"><p>{error}</p><button className="mn-primary" onClick={() => generate(answers)}>Try again</button></div>}
          {!error && (
            <React.Fragment>
              <div className="mn-tickets">
                {picks.map((p, i) => (
                  <article className="mn-ticket" key={p.id}>
                    <div className="mn-stub">{p.rating ? <span className="mn-imdb">TMDB ★ {p.rating}</span> : null}<Poster title={p.title} year={p.year} poster={p.poster} genre={p.gp} kind="card" /></div>
                    <div className="mn-vtear" aria-hidden="true" />
                    <div className="mn-ticket-body">
                      <h3 className="mn-title">{p.title}</h3>
                      <div className="mn-meta"><span>{p.year || "—"}</span>{p.genreLabel ? <React.Fragment><span className="mn-dot-sep" /><span>{p.genreLabel}</span></React.Fragment> : null}</div>
                      <p className="mn-logline">{p.logline || "No synopsis on file — a wildcard pick."}</p>
                      <p className="mn-why"><span className="mn-why-tag">Why you</span>{p.why}</p>
                      <div className="mn-ticket-actions">
                        <button className={"mn-love" + (loved.includes(p.id) ? " done" : "")} onClick={() => loveIt(p)} disabled={loved.includes(p.id)}>{loved.includes(p.id) ? "♥ Saved to taste" : "♡ Loved it"}</button>
                        <button className="mn-watched" onClick={() => markWatched(p)}>✓ Watched recently</button>
                        <button className="mn-skip" onClick={() => notForMe(i)}>Not for me</button>
                      </div>
                    </div>
                  </article>
                ))}
              </div>
              {picks.length === 0 && <div className="mn-empty mn-empty-results"><p>You've cleared tonight's picks — reshuffle for a fresh set.</p></div>}
              <div className="mn-results-foot">
                <button className="mn-secondary" onClick={() => generate(answers)}>Reshuffle picks</button>
                <button className="mn-ghost mn-restart" onClick={startQuiz}>New mood</button>
              </div>
            </React.Fragment>
          )}
        </main>
      )}

      {screen === "taste" && (
        <main className="mn-stage mn-taste">
          <p className="mn-eyebrow">Your taste profile</p>
          <h2 className="mn-nowshowing">Films you love</h2>
          <p className="mn-sub mn-taste-sub">Start typing and pick from the list. I read these every time to match your picks — saved in this browser for next visit.</p>
          <div className="mn-add-wrap">
            <div className="mn-add-row">
              <input className="mn-input" value={query} onChange={(e) => setQuery(e.target.value)} onFocus={() => setFocused(true)} onBlur={() => setTimeout(() => setFocused(false), 160)} placeholder="Start typing… e.g. Parasite, Amélie, Oldboy" aria-label="Search a film you love" />
            </div>
            {showDrop && (
              <div className="mn-drop">
                {searching && <div className="mn-drop-status">Searching…</div>}
                {!searching && matches.map((m) => (
                  <button key={m.id} className="mn-drop-item" onMouseDown={(e) => { e.preventDefault(); addFavorite(m); }}>
                    <span className="mn-drop-title">{m.title}</span>
                    <span className="mn-drop-year">{m.vote_average ? "★ " + m.vote_average.toFixed(1) + "  ·  " : ""}{yearOf(m)}</span>
                  </button>
                ))}
                {!searching && matches.length === 0 && <div className="mn-drop-status">No matches</div>}
              </div>
            )}
          </div>
          {favorites.length === 0 ? (
            <div className="mn-empty"><p>No films yet. Add a few favourites and every recommendation gets sharper.</p></div>
          ) : (
            <div className="mn-poster-grid">
              {favorites.map((f) => (
                <div className="mn-tile" key={f.id}>
                  <Poster title={f.title} year={f.year} poster={f.poster} genre={f.genres && f.genres[0]} kind="tile" />
                  <button className="mn-tile-x" onClick={() => removeFavorite(f.id)} aria-label={"Remove " + f.title}>×</button>
                  <div className="mn-tile-cap"><span className="mn-tile-title">{f.title}</span>{(f.rating || f.year) && <span className="mn-tile-year">{f.rating ? "★ " + f.rating + "  ·  " : ""}{f.year || ""}</span>}</div>
                </div>
              ))}
            </div>
          )}
          <button className="mn-secondary mn-taste-done" onClick={() => setScreen("home")}>Done</button>
        </main>
      )}

      {screen === "watched" && (
        <main className="mn-stage mn-taste">
          <p className="mn-eyebrow">Seen it already</p>
          <h2 className="mn-nowshowing">Watched recently</h2>
          <p className="mn-sub mn-taste-sub">These are kept out of your recommendations. Tap any film to put it back into the mix.</p>
          {watched.length === 0 ? (
            <div className="mn-empty"><p>Nothing here yet. Hit “Watched recently” on a pick to park it here so it stops coming up again.</p></div>
          ) : (
            <div className="mn-poster-grid">
              {watched.map((f) => (
                <div className="mn-tile mn-tile-btn" key={f.id} role="button" tabIndex={0} onClick={() => unwatch(f.id)} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); unwatch(f.id); } }} aria-label={"Put " + f.title + " back into recommendations"}>
                  <div className="mn-tile-poster"><Poster title={f.title} year={f.year} poster={f.poster} genre={f.genres && f.genres[0]} kind="tile" /><span className="mn-seen-badge">✓ Seen</span><span className="mn-putback-ic" aria-hidden="true">↩</span></div>
                  <div className="mn-tile-cap"><span className="mn-tile-title">{f.title}</span>{(f.rating || f.year) && <span className="mn-tile-year">{f.rating ? "★ " + f.rating + "  ·  " : ""}{f.year || ""}</span>}</div>
                </div>
              ))}
            </div>
          )}
          <button className="mn-secondary mn-taste-done" onClick={() => setScreen("home")}>Done</button>
        </main>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MovieNight />);

</script>
</body>
</html>
